<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f8" />
    <meta name="description" content="Porta — AirDrop with links. Temporary, encrypted, device-to-device file sharing from your iPhone, accessible anywhere in the world via a browser." />
    <meta property="og:title" content="Porta — AirDrop with links." />
    <meta property="og:description" content="Turn your phone into a temporary personal sharing node. No uploads, no accounts, no waiting." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Porta — AirDrop with links.</title>
    <script>
      // Set the theme before first paint so there is no flash.
      // Precedence: saved preference > system preference > dark.
      (function () {
        try {
          var saved = localStorage.getItem('porta.theme');
          var sysLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = saved || (sysLight ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
